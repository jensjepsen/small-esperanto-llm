# ~150M params (target: approach NLLB-200-54B MoE chrF++ 61.4)
# Inference: ~8 samples/sec at beam=4 on 5090 bf16 (~2.5x slower than tiny)
# Training: ~9h for 3 epochs on 5090
model:
  d_model: 768
  encoder_layers: 8
  decoder_layers: 8
  heads: 12
  ffn_dim: 3072
  max_position_embeddings: 512

training:
  batch_size: 64
  gradient_accumulation: 2
  epochs: 3
  warmup_steps: 2000
  learning_rate: 3.0e-4
  weight_decay: 0.01
  label_smoothing: 0.1
  dropout: 0.1
