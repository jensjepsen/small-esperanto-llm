# ~61M params (current v6 baseline)
# Inference: ~20 samples/sec at beam=4 on 5090 bf16
# Training: ~3.5h for 3 epochs on 5090 (5.1M pairs, batch=128)
model:
  d_model: 512
  encoder_layers: 6
  decoder_layers: 6
  heads: 8
  ffn_dim: 2048
  max_position_embeddings: 512

training:
  batch_size: 128
  gradient_accumulation: 1
  epochs: 3
  warmup_steps: 2000
  learning_rate: 5.0e-4
  weight_decay: 0.01
  label_smoothing: 0.1
  dropout: 0.1
