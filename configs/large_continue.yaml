model:
  vocab_size: 8000
  hidden_size: 1024
  num_hidden_layers: 16
  num_attention_heads: 16
  num_key_value_heads: 4
  intermediate_size: 2816
  max_position_embeddings: 512
  rms_norm_eps: 1.0e-5

training:
  # Continuation experiment: was the original cosine min_lr (2e-5) actually
  # the binding constraint, or had the model saturated?
  # Resume from v10_large/final with --from-pretrained, constant LR = 1e-4
  # (matches mid-cosine LR in the original run), one epoch.
  # If loss keeps dropping at meaningful rate → LR-bound (need higher floor).
  # If loss is flat → data/capacity ceiling (we were converged).
  num_train_epochs: 1
  # Original v10 used batch=64 × accum=4 on an H100 80GB. 5090 has 32GB → OOM.
  # Halving batch + doubling accum keeps effective batch at 256.
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 8
  # Phase 2: train loss + eval crept up at 5e-5 → too hot.
  # Drop to 2e-5 (the original cosine floor where v10 stopped moving),
  # resume from checkpoint-1500 of v10_continue. Short warmup since we're
  # restarting AdamW fresh on a new LR.
  warmup_steps: 200
  lr_scheduler_type: constant_with_warmup
  learning_rate: 2.0e-5
  weight_decay: 0.1
  fp16: true             # config.py auto-promotes to bf16 on Ampere+
  bf16: false
  max_grad_norm: 1.0
  # Eval every 500 steps gives ~40 eval points over one epoch (~20.5k steps).
  # eval_steps must == save_steps for load_best_model_at_end.
  eval_steps: 500
  save_steps: 500
  save_total_limit: 5
  logging_steps: 25
  dataloader_num_workers: 4
  dataloader_pin_memory: true
