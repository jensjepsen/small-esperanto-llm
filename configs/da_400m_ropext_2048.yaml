model:
  # Same architecture as the base (jensjepsen/danish-lm-400m-base-ckpt310k).
  # The only changes vs h100_400m_4gpu_da.yaml are:
  #   max_position_embeddings: 512 → 2048    (4× extension)
  # Note: rope_theta stays 10000 at the LlamaConfig level here — the actual
  # theta bump happens at load time via --rope-extend-theta (see train.py).
  # That path also lets us keep the base checkpoint untouched on HF and
  # only extend RoPE in the loaded model.
  vocab_size: 16000
  hidden_size: 1536
  num_hidden_layers: 16
  num_attention_heads: 24
  num_key_value_heads: 4
  intermediate_size: 4096
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  # RoPE-extension continued pretrain on 1×H100 80GB.
  #
  # Budget: 500M tokens (well within the 500M-1B range shown sufficient
  # for 4× extension in llama-extend papers).
  #
  # 32 × 1 × 2048 = 65,536 tok/step  → 7,630 steps ≈ 500M tokens
  # On 1×H100 with grad_checkpointing OFF (80GB has plenty of headroom
  # for bs=32 seq=2048 on a 400M model), realistic wall: 1.5-2h.
  # On 1×5090 24GB you'd need bs=4 + grad_accum=8 + grad_checkpointing —
  # ~8-12h wall; use da_400m_ropext_2048_5090 (make that variant if needed).
  #
  # Recipe rationale:
  # - LR 3e-5 constant_with_warmup(100): base was already well-optimized,
  #   we're adapting the attention weights to see new positions — not
  #   relearning. Too high (>5e-5) risks catastrophic short-context
  #   forgetting; too low (<1e-5) fails to adapt the extended range.
  # - Warmup 100: short, since we're continuing (not starting fresh).
  # - Eval every 250 steps to see LongShortPerplexityCallback trajectory
  #   evolve live. Ratio should drop monotonically ~2.65 → ~1.15.
  # - save_total_limit 3, save every 500 → 15 total ckpts, keep 3.
  # - torch_compile ON: the rebuilt LlamaRotaryEmbedding modules may
  #   trigger one recompile at step 0 but then run compiled. If you see
  #   persistent recompile spam past step 10, flip off.
  # - gradient_checkpointing OFF: 400M × bs=32 × seq=2048 activations
  #   fit comfortably in 80GB. Turning it on would cost ~30% wall for
  #   no memory benefit.
  max_steps: 7630
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  warmup_steps: 100
  lr_scheduler_type: constant_with_warmup
  learning_rate: 3.0e-5
  weight_decay: 0.1
  fp16: true                    # config.py auto-promotes to bf16 on Ampere+
  bf16: false
  max_grad_norm: 1.0
  eval_steps: 250
  save_steps: 500
  save_total_limit: 3
  logging_steps: 25
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  group_by_length: false
  optim: adamw_8bit
  # torch_compile disabled: the rebuilt LlamaRotaryEmbedding module
  # crashes dynamo's fake-tensor dispatch during initial compile
  # ("TypeError: unsupported operand type(s) for *: 'torch.dtype' and
  # 'FakeTensor'"). ~15% wall cost; wall estimate becomes ~2.5h.
  torch_compile: false
  gradient_checkpointing: false
