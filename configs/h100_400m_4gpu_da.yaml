model:
  vocab_size: 16000
  # Danish 400M base — 16k byte-level BPE (jensjepsen/danish-tokenizer).
  # ~429M params (with tying: ~404M)
  # Per-layer: attn 5.5M + MLP 18.9M = 24.4M × 16 layers = 390M
  # Embed: 16000 × 1536 = 24.6M (shared with lm_head via tie)
  hidden_size: 1536
  num_hidden_layers: 16
  num_attention_heads: 24       # head_dim = 1536/24 = 64
  num_key_value_heads: 4        # GQA compression 24/4 = 6
  intermediate_size: 4096       # ~2.67× hidden
  max_position_embeddings: 512
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  # 4x H100 80GB via DDP. Danish variant of h100_400m_4gpu.yaml.
  # Effective batch = 64 × 1 × 4 = 256 (LR schedule identical to EO recipe).
  #
  # Launch:
  #   torchrun --nproc_per_node=4 -m esperanto_lm.train \
  #     --config h100_400m_4gpu_da \
  #     --output-dir /workspace/runs/v1_danish_400m \
  #     --tokenizer jensjepsen/danish-tokenizer \
  #     --pretokenized-dataset jensjepsen/danish-pretokenized-16k
  #
  # Add --pretokenized-dataset-supp jensjepsen/danish-pretokenized-16k-supp
  # to concat the recovered shards 3+95 (needs the concat call in train.py).
  #
  # Expected wall (30B tokens/epoch × 2 epochs): ~22-26h on 4×H100.
  # Danish corpus is ~15-20× EO's, so 2 epochs already >> Chinchilla-optimal.
  num_train_epochs: 2
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  warmup_steps: 1000
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  learning_rate: 2.0e-4
  weight_decay: 0.1
  fp16: true                    # config.py auto-promotes to bf16 on Ampere+
  bf16: false
  max_grad_norm: 1.0
  eval_steps: 5000
  save_steps: 5000
  save_total_limit: 3
  logging_steps: 50
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  group_by_length: false        # fixed 512-chunk pretrain → bucketing useless
  optim: adamw_8bit
  torch_compile: true
  torch_compile_mode: default
  gradient_checkpointing: false
