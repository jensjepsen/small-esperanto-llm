model:
  vocab_size: 12413
  # ~409M params (with tying: ~390M)
  # Per-layer: attn 5.5M + MLP 18.9M = 24.4M × 16 layers = 390M
  # Embed: 12413 × 1536 = 19M
  hidden_size: 1536
  num_hidden_layers: 16
  num_attention_heads: 24       # head_dim = 1536/24 = 64
  num_key_value_heads: 4        # GQA compression 24/4 = 6
  intermediate_size: 4096       # ~2.67× hidden
  max_position_embeddings: 512
  rms_norm_eps: 1.0e-5
  # Free at this scale: saves ~19M params + their optim state, slight
  # regularization win. Llama 3.2 1B/3B both tie; only 7B+ untie.
  tie_word_embeddings: true

training:
  # H100 80GB. Same effective batch (256) as h100.yaml but per-device
  # batch dropped from 128 → 64 because 400M activations roughly 2×
  # what 205M used. Accum doubled to keep effective batch matched.
  # Liger FLCE + paged_adamw_8bit reclaim enough VRAM to keep batch=64
  # comfortable without gradient checkpointing.
  #
  # If you can fit batch=128 (paged optim + tied + Liger may unlock it),
  # halve accum to 2 for ~50% wall savings on optimizer-sync overhead.
  num_train_epochs: 10
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 128
  gradient_accumulation_steps: 4
  warmup_steps: 1000
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  learning_rate: 2.0e-4
  weight_decay: 0.1
  fp16: true                    # config.py auto-promotes to bf16 on Ampere+
  bf16: false
  max_grad_norm: 1.0
  eval_steps: 5000
  save_steps: 5000
  save_total_limit: 5
  logging_steps: 50
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  group_by_length: false        # fixed 512-chunk pretrain → bucketing useless
  # 8-bit Adam — saves ~75% of optimizer-state VRAM. At 400M that's
  # ~5GB → ~1GB. Tracks fp32 AdamW within <0.005 ppl at this LR.
  optim: paged_adamw_8bit
  # torch.compile on fixed-shape pretrain chunks → 10-20% wall savings.
  # 1-2 min startup compile. Test a short run if Liger interaction is
  # suspect; abort if loss diverges from a non-compiled baseline.
  torch_compile: true
  torch_compile_mode: reduce-overhead
  # Off by default. Flip true if even batch=64 OOMs (trades ~30% wall
  # for ~30-50% activation VRAM).
  gradient_checkpointing: false
