model:
  vocab_size: 12413
  # ~409M params (with tying: ~390M)
  # Per-layer: attn 5.5M + MLP 18.9M = 24.4M × 16 layers = 390M
  # Embed: 12413 × 1536 = 19M
  hidden_size: 1536
  num_hidden_layers: 16
  num_attention_heads: 24       # head_dim = 1536/24 = 64
  num_key_value_heads: 4        # GQA compression 24/4 = 6
  intermediate_size: 4096       # ~2.67× hidden
  max_position_embeddings: 512
  rms_norm_eps: 1.0e-5
  # Free at this scale: saves ~19M params + their optim state, slight
  # regularization win. Llama 3.2 1B/3B both tie; only 7B+ untie.
  tie_word_embeddings: true

training:
  # 2x H100 80GB via DDP. Identical recipe to h100_400m.yaml EXCEPT
  # gradient_accumulation_steps is halved (4 → 2) because DDP doubles
  # the effective batch by running both GPUs in parallel.
  #
  # Effective batch math (kept at 256, matches h100_400m):
  #   per_device × accum × world_size = 64 × 2 × 2 = 256 ✓
  #
  # Launch via the helper script:
  #   bash scripts/run/launch_h100_400m_2gpu.sh
  # Or directly with torchrun:
  #   torchrun --nproc_per_node=2 -m esperanto_lm.train \
  #     --config h100_400m_2gpu \
  #     --output-dir /workspace/runs/v12_h100_400m \
  #     --tokenizer tokenizer_morpheme
  #
  # Expected wall: ~1.6-1.8× speedup over single-H100 h100_400m
  # (DDP all-reduce adds 10-20% overhead vs theoretical 2×).
  num_train_epochs: 10
  # 80GB H100 batch geometry: per_device=128 fully fills activation
  # memory (~71GB train resident), accum=1 means one fewer fwd/bwd per
  # optim step → ~30-40% wall savings vs per_device=64/accum=2.
  # Effective batch unchanged at 128 × 1 × 2 = 256 (LR schedule intact).
  # Eval cut to 32: PyTorch caching allocator holds train high-water mark
  # across eval, so keeping eval=128 risks fragmentation OOM against the
  # 9GB margin. Eval wall is <1% of total.
  #
  # NOTE on resume: transformers 4.55.4 has a bug at trainer.py:2214 —
  # `self._train_batch_size` is unconditionally clobbered with the saved
  # checkpoint value, ignoring this config. If resuming from a ckpt
  # saved with a DIFFERENT per_device_train_batch_size, ALSO edit the
  # checkpoint's trainer_state.json to set train_batch_size to match
  # this value. See https://github.com/huggingface/transformers/pull/43770
  # for the upstream fix (post-4.57.3).
  per_device_train_batch_size: 128
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  warmup_steps: 1000
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  learning_rate: 2.0e-4
  weight_decay: 0.1
  fp16: true                    # config.py auto-promotes to bf16 on Ampere+
  bf16: false
  max_grad_norm: 1.0
  eval_steps: 5000
  save_steps: 5000
  save_total_limit: 3
  logging_steps: 50
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  group_by_length: false        # fixed 512-chunk pretrain → bucketing useless
  # 8-bit Adam — saves ~75% of optimizer-state VRAM. At 400M that's
  # ~5GB → ~1GB. Tracks fp32 AdamW within <0.005 ppl at this LR.
  # Non-paged variant: paged_adamw_8bit deterministically crashes under
  # DDP on bnb 0.49.x + CUDA 12.8 (cprefetch / pythonInterface.cpp:691,
  # invalid device-ordinal at first optimizer.step on both ranks). The
  # paged allocator binds managed buffers to the rank's local device but
  # prefetches to param.device.index (global ordinal), and the two
  # don't agree under torchrun. State files (.pt) are format-compatible
  # between paged and non-paged, so swapping is lossless on resume.
  # Paged buys nothing on 80GB H100s anyway.
  optim: adamw_8bit
  # torch.compile with default mode (NOT reduce-overhead): Inductor
  # gives us kernel fusion + smarter codegen without the CUDA-graph
  # layer that crashes under DDP (reduce-overhead captured tensors get
  # overwritten by sibling-rank gradient hooks). ~5-15% wall savings
  # instead of the 10-20% reduce-overhead would give, but DDP-safe.
  # If you ever switch DDP → static-graph-DDP or FSDP, reduce-overhead
  # might be revisitable.
  torch_compile: true
  torch_compile_mode: default
  # Off by default. Flip true if even batch=64 OOMs (trades ~30% wall
  # for ~30-50% activation VRAM).
  gradient_checkpointing: false
