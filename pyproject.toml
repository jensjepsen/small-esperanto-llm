[project]
name = "esperanto-lm"
version = "0.1.0"
description = "Small LLaMA-style causal language model trained on Esperanto Wikipedia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0,<2.11",
    # Bumped from <4.50 to ≥4.52 so the latest liger-kernel (which gates
    # apply_liger_kernel_to_llama on transformers≥4.52) actually runs.
    # Pre-fix: liger imported but silently failed at apply-time, paying
    # ~30-40% wall and ~40% VRAM. Upper bound is breathing room.
    "transformers>=4.52,<4.56",
    "datasets>=2.20.0",
    "tokenizers>=0.19.0",
    "accelerate>=0.30.0",
    "trl>=0.14,<0.17",
    "pyyaml>=6.0",
    "rich>=13.0",
    "lark>=1.1",
    "wandb>=0.26.0",
    "pydantic>=2.0",
    "sentencepiece>=0.2.1",
    "sacrebleu>=2.6.0",
    "pylatexenc>=2.10",
    # scripts/ifeval_google/*.py (Google IFEval verifiers used by
    # scripts/eval_ifeval_da.py and src/esperanto_lm/rl_rewards.py
    # for GRPO-combined reward). Deps are cheap; kept in core so
    # every training/eval env has the verifier chain ready.
    "absl-py>=2.0",
    "immutabledict>=4.0",
    "langdetect>=1.0.9",
    "nltk>=3.8",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17.0"]
gemini = ["google-generativeai>=0.8.6", "google-genai>=1.70.0"]
w2v = ["gensim>=4.4.0"]
eval = ["sentence-transformers>=3.0.0"]
train = [
    "liger-kernel>=0.5.0",
    "bitsandbytes>=0.43.0",
]
all = ["wandb>=0.17.0", "google-generativeai>=0.8.6", "google-genai>=1.70.0", "gensim>=4.4.0", "sentence-transformers>=3.0.0", "liger-kernel>=0.5.0", "bitsandbytes>=0.43.0"]

[project.scripts]
train = "esperanto_lm.train:main"
train-tokenizer = "scripts.train_tokenizer:main"
download-data = "scripts.download_data:main"
generate = "scripts.generate:main"
evaluate-coherence = "scripts.evaluate_coherence:main"
download-hplt = "scripts.download_hplt:main"
download-gutenberg = "scripts.download_gutenberg:main"
download-mc4 = "scripts.download_mc4:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"
name = "pytorch-cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esperanto_lm", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
